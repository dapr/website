            <desc id="value-prop-automate-desc">A workflow started by a pub/sub message. Activity 1 reads a secret through the Secrets API, the workflow waits for an event from an external system, Activity 2 calls an app through service invocation, Activity 3 saves key/value state, and on completion the workflow publishes a message.</desc>
            
