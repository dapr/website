    <title id="diagram-integrate-title">Integrate with the infrastructure of your choice</title>
    <desc id="diagram-integrate-desc">An app that uses a secret store and a message broker, which fans out to two apps, one of which uses a database. The same diagram is shown on Microsoft Azure, AWS, Google Cloud, and on-premises, with only the components changing.</desc>
