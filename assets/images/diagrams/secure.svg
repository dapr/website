    <title id="diagram-secure-title">Secure and resilient by default</title>
    <desc id="diagram-secure-desc">An app calls a second app over secure service communication, and the second app publishes to a message broker that delivers to two more apps. Each call that fails is retried by a resiliency policy until it goes through.</desc>
    
