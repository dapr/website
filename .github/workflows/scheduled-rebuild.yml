name: Scheduled rebuild

# Netlify only rebuilds on merges to master. The /events page moves events from
# Upcoming to Past based on the build date, so trigger a build every day.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::notice::NETLIFY_BUILD_HOOK is not set; skipping rebuild"
            exit 0
          fi
          curl -fsS --retry 3 --max-time 30 -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
