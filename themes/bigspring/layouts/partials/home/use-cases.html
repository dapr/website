{{ if site.Data.homepage.useCases.enable }}
{{ with site.Data.homepage.useCases }}
<section>
  <section class="width-80 vertical-align-center padding-top-down-30 value-prop-text">
    <h2 class="text-center padding-bottom-20 text-blue">{{ .title }}</h2>
    {{ if .content }}
    <p class="">
      {{ .content }}
    </p>
    {{ end }}
  </section>
  <section>
    <div class="flex flex-wrap gap-md row-gap-20 width-80 vertical-align-center padding-bottom-20 column-mobile">
      {{ range .feature_item }}
      <div class="feature-card width-half-gap width-90-mobile">
        <div class="icon-container">
          <iconify-icon icon="fluent:{{ .icon }}-24-regular"></iconify-icon>
        </div>
        <h3>{{ .name }}</h3>
        <p>{{ .content }}</p>
        <a href="{{ .link }}" class="btn btn-secondary btn-feature">Learn more about {{ .name }}</a>
      </div>
      {{ end }}
    </div>
  </section>
</section>
{{ end }}
{{ end }}
