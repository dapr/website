<section class="bg-light padding-top-40 padding-top-100-mobile">
  <div class="text-center padding-top-down-10 padding-left-right-20">
    <h1>{{ .Title | markdownify }}</h1>
    {{- /* Answer-first intro: one plain sentence that defines the page's subject. Plain text, not markdownified. */}}
    {{ with .Params.intro }}
    <p class="page-intro">{{ . }}</p>
    {{ end }}
    {{ with .Params.subtitle }}
    <p>{{ . | markdownify }}</p>
    {{ end }}
  </div>
</section>
